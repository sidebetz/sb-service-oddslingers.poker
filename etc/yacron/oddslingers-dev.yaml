defaults:
    shell: /bin/bash
    environment:
      - key: ODDSLINGERS_ENV
        value: DEV
      - key: TERM
        value: ansi

jobs:
  - name: daily-report
    command: doppler run -- python3 manage.py daily_report >> /opt/oddslingers.poker/data/logs/daily_report.log
    schedule: "*/5 * * * *"
    # every 5 minutes

  - name: check-server-load
    command: doppler run -- python3 manage.py check_server_load >> /opt/oddslingers.poker/data/logs/server_load.log
    schedule: "*/5 * * * *"
    # every 5 minutes

  - name: weekly-rewards
    command: doppler run -- python3 manage.py weekly_rewards >> /opt/oddslingers.poker/data/logs/weekly_rewards.log
    schedule: "*/5 * * * *"
    # every 5 minutes

  - name: leaderboard-cache
    command: doppler run -- python3 manage.py save_leaderboard_cache >> /opt/oddslingers.poker/data/logs/leaderboard-cache.log
    schedule: "0 0 * * *"
    # every day at 00:00hrs